name: ohos-cross-build

# Cross-builds the OpenHarmony arm64 runtime inside the published
# dotnet-buildtools image (dotnet/dotnet-buildtools-prereqs-docker#1786).
# The device cannot build its own runtime (`build.sh` -> Unsupported OS
# harmonyos), so this is the supported way to produce libcoreclr.so,
# createdump and stress-log builds for on-device verification.
on:
  workflow_dispatch:
    inputs:
      stress_log:
        description: "Build with FeatureStressLog=true"
        type: choice
        options: ["false", "true"]
        default: "true"
      subset:
        description: "Build subset"
        default: "clr.runtime"
      source_ref:
        description: "Branch/tag to build (match the device SDK line)"
        default: "release/ohos-11.0.0"
      maui_ref:
        description: "maui-ohos ref (slice/11.0.10 for the MAUI GA validation)"
        default: "feature/openharmony"
      maui_pin:
        description: "MAUI package pin: rc2 (device baseline) or ga"
        type: choice
        options: ["rc2", "ga"]
        default: "rc2"

permissions:
  contents: write

jobs:
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net12.0-cross-openharmony-6.0-amd64
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Limit ninja parallelism
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          real="$(command -v ninja)"
          printf '#!/bin/sh\nexec %s -j4 "$@"\n' "$real" > "$RUNNER_TEMP/bin/ninja"
          chmod +x "$RUNNER_TEMP/bin/ninja"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "ninja shim -> $real -j4"
      - name: Show image toolchain
        run: |
          cat /etc/os-release | head -2 || true
          command -v cmake clang ninja || true
          echo "OHOS_NDK_HOME=${OHOS_NDK_HOME:-unset}"
      - name: Restore
        env:
          OHOS_ASSETS: /opt/ohos-assets
          OPENSSL_ROOT_DIR: /opt/ohos-assets/openssl
          CMAKE_INCLUDE_PATH: /opt/ohos-assets/icu/include
          CMAKE_LIBRARY_PATH: /opt/ohos-assets/icu/lib
          CMAKE_PREFIX_PATH: /opt/ohos-assets/icu:/opt/ohos-assets/openssl
          ICU_ROOT: /opt/ohos-assets/icu
          PATH: /opt/ohos-toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -eu
          ./build.sh clr.runtime -c release -arch arm64 -cross -os openharmony -restore
      - name: Build
        env:
          STRESS_LOG: ${{ inputs.stress_log }}
          SUBSET: ${{ inputs.subset }}
          OHOS_ASSETS: /opt/ohos-assets
          OPENSSL_ROOT_DIR: /opt/ohos-assets/openssl
          CMAKE_INCLUDE_PATH: /opt/ohos-assets/icu/include
          CMAKE_LIBRARY_PATH: /opt/ohos-assets/icu/lib
          CMAKE_PREFIX_PATH: /opt/ohos-assets/icu:/opt/ohos-assets/openssl
          ICU_ROOT: /opt/ohos-assets/icu
          PATH: /opt/ohos-toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -eu
          extra=""
          [ "$STRESS_LOG" = "true" ] && extra="/p:FeatureStressLog=true"
          # the OHOS toolchain restricts find_* to the sysroot, so stage ICU/OpenSSL there
          SYSROOT="${OHOS_NDK_HOME:-/opt/ohos-sdk/linux}/native/sysroot"
          mkdir -p "$SYSROOT/usr/include" "$SYSROOT/usr/lib"
          cp -a /opt/ohos-assets/icu/include/unicode "$SYSROOT/usr/include/" 2>/dev/null || true
          cp -a /opt/ohos-assets/icu/lib/*.a "$SYSROOT/usr/lib/" 2>/dev/null || true
          cp -a /opt/ohos-assets/openssl/include/openssl "$SYSROOT/usr/include/" 2>/dev/null || true
          cp -a /opt/ohos-assets/openssl/lib/*.a "$SYSROOT/usr/lib/" 2>/dev/null || true
          ls "$SYSROOT/usr/include/unicode/ucurr.h" "$SYSROOT/usr/lib" | head -5 || true
          ls /opt/ohos-assets/openssl/lib /opt/ohos-assets/openssl/include 2>/dev/null | head -20 || true
          find /opt/ohos-assets -name ucurr.h 2>/dev/null | head -3 || true
          find /opt/ohos-assets -maxdepth 4 -name "unicode" -type d 2>/dev/null | head -3 || true
          ./build.sh "$SUBSET" -c release -arch arm64 -cross -os openharmony \
            /p:RestoreUseStaticGraphEvaluation=false \
            -cmakeargs "-DCMAKE_INCLUDE_PATH=/opt/ohos-assets/icu/include" \
            -cmakeargs "-DCMAKE_LIBRARY_PATH=/opt/ohos-assets/icu/lib" \
            -cmakeargs "-DOPENSSL_ROOT_DIR=/opt/ohos-assets/openssl" \
            -cmakeargs "-DOPENSSL_INCLUDE_DIR=/opt/ohos-assets/openssl/include" \
            -cmakeargs "-DOPENSSL_CRYPTO_LIBRARY=/opt/ohos-assets/openssl/lib/libcrypto.a" \
            -cmakeargs "-DOPENSSL_SSL_LIBRARY=/opt/ohos-assets/openssl/lib/libssl.a" \
            -cmakeargs "-DICU_ROOT=/opt/ohos-assets/icu" \
            -cmakeargs "-DICU_INCLUDE_DIR=/opt/ohos-assets/icu/include" \
            -cmakeargs "-DICU_UC_LIBRARY=/opt/ohos-assets/icu/lib/libicuuc.a" \
            -cmakeargs "-DICU_I18N_LIBRARY=/opt/ohos-assets/icu/lib/libicui18n.a" \
            $extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreclr-arm64-openharmony
          path: |
            artifacts/bin/coreclr/**
            artifacts/log/**
          if-no-files-found: warn

  verify826:
    name: build verify.dll (container)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net12.0-cross-openharmony-6.0-amd64
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: springmin/sdk-ohos
          ref: feature/openharmony
          path: sdk-ohos
      - uses: actions/checkout@v4
        with:
          repository: springmin/ohos-workload
          path: sdk-ohos/ohos-workload
      - uses: actions/checkout@v4
        with:
          repository: springmin/maui-ohos
          ref: ${{ inputs.maui_ref }}
          path: sdk-ohos/maui-ohos
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build verify.dll
        run: |
          set -eu
          gp="${NUGET_PACKAGES:-}"
          [ -n "$gp" ] || gp="$HOME/.nuget/packages"
          echo "global packages: $gp"
          arc="$gp/microsoft.dotnet.arcade.sdk/11.0.0-beta.26527.113/tools/"
          # maui_pin=rc2 reproduces the device baseline; ga keeps verify.csproj on 11.0.10.
          mkdir -p maui-feed
          if [ "${{ inputs.maui_pin }}" = "rc2" ]; then
            curl -fsSL -o /tmp/maui-rc2.tgz \
              https://github.com/springmin/sdk-ohos/releases/download/maui-rc2-11.0.0-rc.2.26505.5/maui-rc2-nupkgs.tar.gz
            tar -xzf /tmp/maui-rc2.tgz -C maui-feed
            sed -i 's/Version="11.0.10"/Version="11.0.0-rc.2.26505.5"/g' \
              sdk-ohos/ohos-workload/test/maui-platform-verify/verify.csproj
            grep -c '11.0.0-rc.2.26505.5' sdk-ohos/ohos-workload/test/maui-platform-verify/verify.csproj
          else
            grep -n 'Microsoft.Maui.Controls' sdk-ohos/ohos-workload/test/maui-platform-verify/verify.csproj | head -2
          fi
          ls -d "$arc" || echo "WARN: arcade tools missing at $arc"
          # the repo pins SDK 12.0.100-alpha; the container has 11.0.x
          printf '%s\n' '{"msbuild-sdks":{"Microsoft.DotNet.Arcade.Sdk":"11.0.0-beta.26527.113"}}' > sdk-ohos/global.json
          # the version only exists on the internal dnceng feed; use the mirrored nupkg
          mkdir -p offline-feed
          curl -fsSL -o "offline-feed/microsoft.dotnet.arcade.sdk.11.0.0-beta.26527.113.nupkg" \
            https://github.com/springmin/sdk-ohos/releases/download/arcade-mirror-11.0.0-beta.26527.113/microsoft.dotnet.arcade.sdk.11.0.0-beta.26527.113.nupkg
          ls -l offline-feed
          CFG="<configuration><packageSources><clear /><add key='local' value='$GITHUB_WORKSPACE/offline-feed' /><add key='maui' value='$GITHUB_WORKSPACE/maui-feed' /><add key='nuget.org' value='https://api.nuget.org/v3/index.json' /></packageSources></configuration>"
          printf '<?xml version="1.0" encoding="utf-8"?>\n%s\n' "$CFG" > sdk-ohos/NuGet.config
          cat sdk-ohos/NuGet.config
          cd sdk-ohos/ohos-workload/test/maui-platform-verify
          dotnet restore /p:NuGetAudit=false /p:ArcadeSdkDir="$arc"
          dotnet build --no-restore -m:1 -noconlog -tl:off \
            "-flp:logfile=$PWD/build.log;verbosity=minimal" \
            /p:RunAnalyzers=false /p:TreatWarningsAsErrors=false \
            /p:UseSharedCompilation=false /p:NuGetAudit=false /p:ArcadeSdkDir="$arc" \
            || { echo "=== build.log (tail) ==="; tail -30 build.log; exit 1; }
          ls -l bin/Debug/net11.0/verify.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify826
          path: |
            sdk-ohos/ohos-workload/test/maui-platform-verify/bin/**
            sdk-ohos/ohos-workload/test/maui-platform-verify/build.log
          if-no-files-found: warn

  jit-hap:
    name: build JIT hap (container)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net12.0-cross-openharmony-6.0-amd64
      options: --platform linux/amd64
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/checkout@v4
        with:
          repository: springmin/ohos-workload
          path: ohos-workload
      - uses: actions/checkout@v4
        with:
          repository: springmin/maui-ohos
          ref: ${{ inputs.maui_ref }}
          path: maui-ohos
      - name: Install the OpenHarmony workload
        run: |
          set -eu
          curl -fsSL -o wl.tar.gz https://github.com/springmin/sdk-ohos/releases/download/workload-1.0.0/openharmony-workload-1.0.0.tar.gz
          mkdir -p wl && tar -xzf wl.tar.gz -C wl
          D=$(find wl -mindepth 1 -maxdepth 1 -type d | head -1)
          sh "$D/install-ohos-workload.sh" --dotnet "$(command -v dotnet)" "$D"
      - name: Fetch the OpenHarmony SDK (packaging tools)
        run: |
          set -eu
          D="$RUNNER_TEMP/ohos-sdk"
          mkdir -p "$D"
          curl -fL --retry 5 --connect-timeout 30 --max-time 1800 -o /tmp/sdk.tar.gz \
            https://netcorenativeassets.blob.core.windows.net/resource-packages/external/OpenHarmony/ohos-sdk-windows_linux-public-6.0.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C "$D"
          for z in $(find "$D/linux" -maxdepth 2 \( -name '*toolchains*.zip' -o -name 'native-*.zip' \) 2>/dev/null); do
            unzip -q -o "$z" -d "$D/linux" || true
          done
      - name: Shim the jar-based OHOS tools
        run: |
          set -eu
          lib="$RUNNER_TEMP/ohos-sdk/linux/toolchains/lib"
          printf '#!/bin/sh\nexec java -jar "%s/app_packing_tool.jar" "$@"\n' "$lib" > "$lib/ohos_packing_tool"
          printf '#!/bin/sh\nexec java -jar "%s/hap-sign-tool.jar" "$@"\n' "$lib" > "$lib/hap-sign-tool"
          chmod +x "$lib/ohos_packing_tool" "$lib/hap-sign-tool"
          tc="$(dirname "$lib")"
          cp -f "$lib/ohos_packing_tool" "$tc/ohos_packing_tool"
          cp -f "$lib/hap-sign-tool" "$tc/hap-sign-tool"
      - name: Publish hello-maui-app (JIT)
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
          OpenHarmonySdkRoot: ${{ runner.temp }}/ohos-sdk/linux
          OHOS_SDK_ROOT: ${{ runner.temp }}/ohos-sdk/linux
        run: |
          set -eu
          cd ohos-workload/test/hello-maui-app
          dotnet publish hello-maui-app.csproj -c Release -r openharmony-arm64 -m:1 -tl:off \
            -p:OpenHarmonyUIPage=pages/Index -p:OpenHarmonyHapPackage=true \
            -f net11.0-openharmony26.0 -p:OpenHarmonyRuntimeMode=jit -p:InvariantGlobalization=true \
            -p:RunAnalyzers=false -p:TreatWarningsAsErrors=false \
            -p:OpenHarmonySdkRoot="$OpenHarmonySdkRoot" \
            -p:OpenHarmonyToolchainDir="$OpenHarmonySdkRoot/toolchains" \
            -p:OpenHarmonyHapSigning=false
          ls -l bin/Release/net11.0-openharmony26.0/openharmony-arm64/*.hap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-hap
          path: ohos-workload/test/hello-maui-app/bin/**
          if-no-files-found: warn

      - name: Stage the JIT hap asset
        run: |
          set -eu
          f="$(find ohos-workload/test/hello-maui-app/bin -name '*.hap' | head -1)"
          cp -f "$f" jit-hap.hap
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-prebuilts
          name: CI prebuilts
          body: Rolling release with the newest container-built haps.
          files: jit-hap.hap
          overwrite_files: true

  aot-hap:
    name: build AOT hap (container)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net12.0-cross-openharmony-6.0-amd64
      options: --platform linux/amd64
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/checkout@v4
        with:
          repository: springmin/ohos-workload
          path: ohos-workload
      - uses: actions/checkout@v4
        with:
          repository: springmin/maui-ohos
          ref: ${{ inputs.maui_ref }}
          path: maui-ohos
      - name: Install the OpenHarmony workload
        run: |
          set -eu
          curl -fsSL -o wl.tar.gz https://github.com/springmin/sdk-ohos/releases/download/workload-1.0.0/openharmony-workload-1.0.0.tar.gz
          mkdir -p wl && tar -xzf wl.tar.gz -C wl
          D=$(find wl -mindepth 1 -maxdepth 1 -type d | head -1)
          sh "$D/install-ohos-workload.sh" --dotnet "$(command -v dotnet)" "$D"
      - name: Cache the OpenHarmony SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-public-6.0-v1
      - name: Fetch the OpenHarmony SDK (packaging tools)
        run: |
          set -eu
          D="$RUNNER_TEMP/ohos-sdk"
          if [ ! -d "$D/linux/toolchains" ]; then
            mkdir -p "$D"
            curl -fL --retry 5 --connect-timeout 30 --max-time 1800 -o /tmp/sdk.tar.gz \
              https://netcorenativeassets.blob.core.windows.net/resource-packages/external/OpenHarmony/ohos-sdk-windows_linux-public-6.0.tar.gz
            tar -xzf /tmp/sdk.tar.gz -C "$D"
            for z in $(find "$D/linux" -maxdepth 2 \( -name '*toolchains*.zip' -o -name 'native-*.zip' \) 2>/dev/null); do
              unzip -q -o "$z" -d "$D/linux" || true
            done
          fi
      - name: Shim the jar-based OHOS tools
        run: |
          set -eu
          lib="$RUNNER_TEMP/ohos-sdk/linux/toolchains/lib"
          printf '#!/bin/sh\nexec java -jar "%s/app_packing_tool.jar" "$@"\n' "$lib" > "$lib/ohos_packing_tool"
          printf '#!/bin/sh\nexec java -jar "%s/hap-sign-tool.jar" "$@"\n' "$lib" > "$lib/hap-sign-tool"
          chmod +x "$lib/ohos_packing_tool" "$lib/hap-sign-tool"
          tc="$(dirname "$lib")"
          cp -f "$lib/ohos_packing_tool" "$tc/ohos_packing_tool"
          cp -f "$lib/hap-sign-tool" "$tc/hap-sign-tool"
      - name: Fetch the AOT feed
        run: |
          set -eu
          mkdir -p feed
          base=https://github.com/springmin/sdk-ohos/releases/download/aot-packs-11.0.0-rtm
          for a in Microsoft.DotNet.ILCompiler.11.0.0-rtm.nupkg \
                   Microsoft.NETCore.App.Runtime.NativeAOT.openharmony-arm64.11.0.0-rtm.nupkg \
                   runtime.openharmony-arm64.Microsoft.DotNet.ILCompiler.11.0.0-rtm.nupkg \
                   Microsoft.NET.ILLink.Tasks.11.0.0-rtm.26472.124.nupkg; do
            curl -fsSL -o "feed/$a" "$base/$a" || echo "WARN: missing $a"
          done
          ls -l feed
      - name: Publish AOT hap
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
          OpenHarmonySdkRoot: ${{ runner.temp }}/ohos-sdk/linux
          OHOS_SDK_ROOT: ${{ runner.temp }}/ohos-sdk/linux
          AOT_WORKDIR: ${{ runner.temp }}/aot-work
          CppCompilerAndLinker: /opt/ohos-toolchain/bin/aarch64-linux-ohos-cc
          ObjCopyName: /opt/ohos-toolchain/bin/aarch64-linux-ohos-objcopy
          CC: /opt/ohos-toolchain/bin/aarch64-linux-ohos-cc
          CXX: /opt/ohos-toolchain/bin/aarch64-linux-ohos-c++
          OpenHarmonyHapSigning: "false"
        run: |
          set -eu
          mkdir -p "$AOT_WORKDIR/feed"
          cp -f feed/*.nupkg "$AOT_WORKDIR/feed/" 2>/dev/null || true
          # restore needs these folders registered as NuGet sources
          mkdir -p offline-feed
          curl -fsSL -o offline-feed/microsoft.dotnet.arcade.sdk.11.0.0-beta.26527.113.nupkg \
            https://github.com/springmin/sdk-ohos/releases/download/arcade-mirror-11.0.0-beta.26527.113/microsoft.dotnet.arcade.sdk.11.0.0-beta.26527.113.nupkg
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            "<configuration><packageSources><clear /><add key='aot-feed' value='$AOT_WORKDIR/feed' /><add key='local-arcade' value='$GITHUB_WORKSPACE/offline-feed' /><add key='nuget.org' value='https://api.nuget.org/v3/index.json' /></packageSources></configuration>" \
            > ohos-workload/NuGet.config
          cat ohos-workload/NuGet.config
          # publish-aot.sh pins --source to the AOT feed, which hides MAUI/nuget.org
          sed -i 's#--source "$BASE/feed"#--source "$BASE/feed" --source "$GITHUB_WORKSPACE/offline-feed" --source https://api.nuget.org/v3/index.json#' \
            ohos-workload/test/hello-maui-app/publish-aot.sh
          sed -i 's#-p:OpenHarmonyRuntimeMode=aot #-p:OpenHarmonyRuntimeMode=aot -p:RunAnalyzers=false -p:TreatWarningsAsErrors=false -p:OpenHarmonyHapSigning=false #' \
            ohos-workload/test/hello-maui-app/publish-aot.sh
          grep -n 'source' ohos-workload/test/hello-maui-app/publish-aot.sh | tail -2
          cd ohos-workload
          AOT_WORKDIR="$AOT_WORKDIR" DOTNET="$(command -v dotnet)" \
            sh test/hello-maui-app/publish-aot.sh || { tail -40 "$AOT_WORKDIR/publish-aot.log" 2>/dev/null; exit 1; }
          grep -q 'EXIT=0' "$AOT_WORKDIR/publish-aot.log"
          ls -l test/hello-maui-app/bin/Release/net11.0-openharmony26.0/openharmony-arm64/*.hap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aot-hap
          path: |
            ohos-workload/test/hello-maui-app/bin/**
            ${{ runner.temp }}/aot-work/publish-aot.log
          if-no-files-found: warn

      - name: Stage the AOT hap asset
        run: |
          set -eu
          f="$(find ohos-workload/test/hello-maui-app/bin -name '*.hap' | head -1)"
          cp -f "$f" aot-hap.hap
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-prebuilts
          name: CI prebuilts
          body: Rolling release with the newest container-built haps.
          files: aot-hap.hap
          overwrite_files: true
